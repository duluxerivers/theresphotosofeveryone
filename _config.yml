title: "There's Photos of Everyone"
tagline: "An archive"
description: ""

permalink: /:year/:month/:day/:title/
timezone: Etc/UTC

# The site lives at https://duluxerivers.github.io/theresphotosofeveryone/, so
# every link needs that folder in front of it. GitHub Pages does not fill this
# in for you.
# If you ever put a custom domain on it, change baseurl to "" and url to the
# domain — otherwise every link will break.
url: "https://duluxerivers.github.io"
baseurl: "/theresphotosofeveryone"

# --- Seasons -----------------------------------------------------------------
# One file per season in _seasons/. The number in the filename is the number you
# put in a post's `season:` field. Add a season by adding a file — see POSTING.md.
collections:
  seasons:
    output: true
    permalink: /season/:path/

# How many posts a feed reveals at a time before loading more.
feed_step: 8

# --- Password gate -----------------------------------------------------------
# The password itself is never stored here. What is stored is a PBKDF2-SHA256
# hash of it. To change the password, run the helper described in POSTING.md
# and paste the new salt + hash below.
gate:
  salt: "e7f3a91c4b2d8065"
  hash: "542c761a213106d788ba692670fd03e8aeccd4e00a711ef622d8565f510183ab"
  iterations: 150000
  # Shown under the password box. Keep it vague — it is public.
  hint: ""
  # Bump this if you rewrite the disclaimer and want everyone to agree again.
  terms_version: "1"

# --- Behaviour ---------------------------------------------------------------
# Images render slightly desaturated and come to full colour on hover.
moody_images: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - POSTING.md
  - README.md
  - vendor
  - .jekyll-cache

# No sitemap, no feed, no SEO tags. This site is meant to stay unfindable.
plugins: []
