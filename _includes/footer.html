<footer class="site-foot">
  <span>{{ site.posts.size }} {% if site.posts.size == 1 %}entry{% else %}entries{% endif %}</span>
  <span>
    <a href="{{ '/about/' | relative_url }}">About</a>
    &nbsp;&nbsp;
    <a href="#" id="relock">Lock</a>
  </span>
</footer>

<script>
(function () {
  var b = document.getElementById("relock");
  if (!b) return;
  b.addEventListener("click", function (e) {
    e.preventDefault();
    try {
      localStorage.removeItem("tpoe.key");
      localStorage.removeItem("tpoe.agreed");
    } catch (err) {}
    location.reload();
  });
})();
</script>
